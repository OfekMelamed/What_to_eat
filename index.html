<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F3F4F8">
<title>ביס · מה נאכל?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#F3F4F8;
  --card:#FFFFFF;
  --ink:#14182B;
  --muted:#697089;
  --line:#E6E8F0;
  --blue:#2438E8;
  --blue-soft:#E8EBFF;
  --like:#FF4F7B;
  --nope:#8C91AD;
  --zest:#FFD23F;
  --open:#12A150;
  --closed:#D93A3A;
  --radius:24px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Assistant","Segoe UI",Arial,sans-serif;font-size:16px;overflow:hidden;overscroll-behavior:none}
h1,h2,h3{font-family:"Secular One","Assistant",sans-serif;font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}

.app{height:100%;max-width:470px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 12px);gap:10px}

/* ---------- header ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:"Secular One",sans-serif;font-size:28px;line-height:1;display:flex;align-items:center;gap:8px;color:var(--blue)}
.logo .bite{width:28px;height:28px;border-radius:50%;background:var(--blue);position:relative;flex:none}
.logo .bite::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:var(--bg);top:-3px;left:-3px}
.likes-btn{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(20,24,43,.08)}
.likes-btn .count{background:var(--like);color:#fff;border-radius:999px;min-width:22px;height:22px;display:inline-grid;place-items:center;font-size:13px;padding:0 6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.chip.small{padding:4px 11px;font-size:14px}
.meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 8px;color:var(--muted);font-size:14px}
.selects{display:flex;gap:6px}
.sel{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:3px 4px 3px 10px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;color:var(--muted)}
.sel select{border:0;background:none;font:inherit;font-weight:800;color:var(--ink);padding:2px 2px;outline-offset:2px}

/* ---------- deck & card ---------- */
.deck{position:relative;flex:1;min-height:0;margin-bottom:16px}
.card{
  position:absolute;inset:0;background:var(--card);border-radius:var(--radius);
  box-shadow:0 14px 34px -14px rgba(20,24,43,.35),0 1px 3px rgba(20,24,43,.06);
  overflow:hidden;display:flex;flex-direction:column;
  touch-action:pan-y;user-select:none;-webkit-user-select:none;
  transform-origin:50% 110%;transition:transform .3s cubic-bezier(.2,.8,.3,1);will-change:transform;
}
.card.behind-1{transform:translateY(10px) scale(.955)}
.card.behind-2{transform:translateY(20px) scale(.91)}
.card.behind-1 .scroll,.card.behind-2 .scroll{overflow:hidden}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.card.is-top{cursor:grab}

.hero{position:relative;flex:none;height:clamp(160px,30vh,260px);overflow:hidden;background:var(--c1)}
.hero .art{position:absolute;inset:0;display:grid;place-items:center;background:var(--c1)}
.hero .art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.28) 2px,transparent 2.5px);background-size:22px 22px}
.hero .art span{font-size:96px;position:relative;transform:rotate(-8deg);filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.hero img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
.pill{position:absolute;z-index:2;border-radius:999px;padding:4px 11px;font-weight:700;font-size:13.5px;line-height:1.3;font-variant-numeric:tabular-nums}
.pill.dist{top:12px;inset-inline-end:12px;background:rgba(20,24,43,.82);color:#fff}
.pill.status{top:12px;inset-inline-start:12px;background:#fff}
.pill.status.open{color:var(--open)}
.pill.status.closed{color:var(--closed)}
.pill.special{bottom:12px;inset-inline-end:12px;background:var(--zest);color:var(--ink)}
.credit{position:absolute;z-index:2;bottom:8px;inset-inline-end:12px;color:rgba(255,255,255,.9);font-size:11.5px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.body{flex:none;padding:0 18px 16px;display:flex;flex-direction:column;gap:9px}
.head{display:flex;align-items:flex-start;gap:12px;margin-top:-30px;position:relative;z-index:3}
.logo-sq{
  flex:none;width:62px;height:62px;border-radius:14px;background:#fff;
  box-shadow:0 0 0 3px #fff,0 6px 14px -4px rgba(20,24,43,.35);
  display:grid;place-items:center;overflow:hidden;
}
.logo-sq img{width:100%;height:100%;object-fit:contain;padding:6px;-webkit-user-drag:none;pointer-events:none}
.logo-sq .mono{width:100%;height:100%;display:grid;place-items:center;font-family:"Secular One",sans-serif;font-size:26px;color:#fff;background:var(--c2)}
.head .titles{min-width:0;padding-top:38px}
.head h2{font-size:25px;line-height:1.1;overflow-wrap:anywhere}
.line{color:var(--muted);font-size:15px;display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.line .dot::before{content:"·"}
.star{color:var(--ink);font-weight:800}
.star svg{width:14px;height:14px;fill:#F5B301;vertical-align:-1px}
.summary{margin:0;font-size:15.5px;line-height:1.45}
.note{background:#FFF3C4;border-radius:12px;padding:8px 12px;font-weight:700}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:15px}
.facts li{display:flex;gap:10px;align-items:flex-start}
.facts svg{width:18px;height:18px;flex:none;margin-top:2px;stroke:var(--muted);fill:none;stroke-width:2}
.facts .v{min-width:0;overflow-wrap:anywhere}
.facts a{color:var(--blue);font-weight:700;text-decoration:none}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;color:#454B63}
.card-actions{display:flex;gap:8px;margin-top:2px}
.site-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--blue-soft);color:var(--blue);text-decoration:none;font-weight:800;border-radius:14px;padding:11px 12px;font-size:15.5px}
.site-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.src{color:var(--muted);font-size:11.5px;text-align:center}

.stamp{position:absolute;top:26px;z-index:6;font-family:"Secular One",sans-serif;font-size:32px;padding:2px 14px;border:4px solid;border-radius:12px;opacity:0;pointer-events:none;background:rgba(255,255,255,.92)}
.stamp.yes{color:var(--like);border-color:var(--like);left:20px;transform:rotate(-14deg)}
.stamp.no{color:var(--nope);border-color:var(--nope);right:20px;transform:rotate(14deg)}

/* ---------- actions ---------- */
.actions{display:flex;justify-content:center;align-items:center;gap:18px}
.round{width:62px;height:62px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(20,24,43,.4);transition:transform .15s}
.round:active{transform:scale(.9)}
.round svg{width:28px;height:28px}
.round.nope svg{stroke:var(--nope)}
.round.like svg{fill:var(--like)}
.surprise{height:62px;border-radius:999px;background:var(--zest);color:var(--ink);padding:0 22px;font-family:"Secular One",sans-serif;font-size:19px;box-shadow:0 8px 20px -8px rgba(20,24,43,.4);display:flex;align-items:center;gap:8px;transition:transform .15s}
.surprise:active{transform:scale(.94)}
.surprise svg{width:24px;height:24px}
.hint{color:var(--muted);text-align:center;font-size:13px;margin:0}

/* ---------- full screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px);text-align:center;color:#fff;gap:16px;background:var(--blue)}
.screen .big{font-size:clamp(44px,14vw,62px);line-height:1}
.screen p{max-width:32ch;margin:0;font-size:18px;line-height:1.5}
.screen .from{opacity:.8;font-size:16px}
.btn{background:#fff;color:var(--blue);border-radius:999px;padding:14px 26px;font-family:"Secular One",sans-serif;font-size:20px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.btn.pink{background:var(--like);color:#fff}
.plates{display:flex;gap:10px;font-size:40px}
.plates span{animation:bob 1.6s ease-in-out infinite}
.plates span:nth-child(2){animation-delay:.2s}.plates span:nth-child(3){animation-delay:.4s}
@keyframes bob{50%{transform:translateY(-10px)}}

.match{background:var(--like);overflow-y:auto;justify-content:flex-start}
.match .inner{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;align-items:center;margin-block:auto}
.match .big{font-size:clamp(46px,15vw,68px);transform:rotate(-4deg);text-shadow:0 4px 0 rgba(0,0,0,.12)}
.match-card{width:100%;background:var(--card);color:var(--ink);border-radius:var(--radius);overflow:hidden;text-align:start;box-shadow:0 18px 40px -12px rgba(60,0,20,.5)}
.match-card .hero{height:170px;min-height:0}
.match-card .body{padding-bottom:18px}
.nav-title{font-weight:800;font-size:17px;margin-top:4px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.links a{background:#fff;color:var(--ink);text-decoration:none;border-radius:18px;padding:15px 10px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.links a.waze{background:#33CCFF}
.links svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:2.2}
.hearts{position:fixed;inset:0;pointer-events:none;z-index:21;overflow:hidden}
.hearts i{position:absolute;bottom:-40px;font-style:normal;font-size:26px;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}

.slot{background:var(--zest);color:var(--ink)}
.slot .reel{font-family:"Secular One",sans-serif;font-size:clamp(28px,9vw,40px);min-height:2.6em;display:grid;place-items:center;max-width:14ch;line-height:1.2}
.slot .reel-emoji{font-size:90px}

.drawer{position:fixed;inset:0;z-index:15;background:rgba(20,24,43,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:470px;max-height:80%;border-radius:24px 24px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center}
.sheet-head h2{font-size:24px}
.sheet ul{list-style:none;margin:0;padding:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.sheet li{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:16px;padding:8px 10px}
.sheet li .logo-sq{width:46px;height:46px;border-radius:11px;box-shadow:0 0 0 1px var(--line)}
.sheet li .logo-sq .mono{font-size:20px}
.sheet li .t{flex:1;min-width:0}
.sheet li .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet li .t small{color:var(--muted)}
.sheet li a{background:var(--blue);color:#fff;text-decoration:none;border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.close{background:var(--bg);border-radius:999px;padding:6px 14px;font-weight:800}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section class="screen" id="welcome">
  <div class="plates" aria-hidden="true"><span>🍕</span><span>🍣</span><span>🌮</span></div>
  <h1 class="big" id="welcomeTitle">היי</h1>
  <p id="dedication"></p>
  <p class="from" id="fromLine"></p>
  <button class="btn" id="startBtn">בואי נמצא מה לאכול</button>
  <p class="from" style="font-size:14px">נצטרך את המיקום שלך כדי למצוא מקומות קרובים</p>
</section>

<section class="screen" id="loading" hidden>
  <div class="plates" aria-hidden="true"><span>🥙</span><span>🍜</span><span>🍰</span></div>
  <h2 class="big" style="font-size:34px" id="loadingText">מחפש מקומות סביבך…</h2>
  <p id="loadingSub">זה לוקח כמה שניות</p>
  <button class="btn" id="retryBtn" hidden>לנסות שוב</button>
  <p id="errDetail" class="ltr" style="font-size:12px;opacity:.7;max-width:40ch" hidden></p>
</section>

<main class="app" id="app" hidden>
  <header class="topbar">
    <div class="logo"><span class="bite" aria-hidden="true"></span>ביס</div>
    <button class="likes-btn" id="likesBtn"><span>המאצ'ים שלי</span><span class="count" id="likesCount">0</span></button>
  </header>
  <div class="chips" id="filters" role="group" aria-label="סוג מקום"></div>
  <div class="meta">
    <span id="metaCount"></span>
    <div class="selects">
      <label class="sel"><span>סדר:</span><select id="sortSel"><option value="mix">מומלץ</option><option value="pop">הכי פופולרי</option><option value="near">הכי קרוב</option></select></label>
      <label class="sel"><span>רדיוס:</span><select id="radiusSel"></select></label>
    </div>
  </div>
  <div class="deck" id="deck" aria-live="polite"></div>
  <div class="actions">
    <button class="round nope" id="nopeBtn" aria-label="לא הפעם"><svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="surprise" id="surpriseBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="16" cy="16" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>תפתיע אותי</button>
    <button class="round like" id="likeBtn" aria-label="בא לי"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.4.7-1.2 2.2-2.4 4.3-2.4 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg></button>
  </div>
  <p class="hint">ימינה = בא לי · שמאלה = לא הפעם · אפשר לגלול בכרטיס למטה</p>
</main>

<section class="screen match" id="match" hidden>
  <div class="inner">
    <h2 class="big" dir="ltr">It's a Match!</h2>
    <p id="matchLine"></p>
    <div class="match-card" id="matchCard"></div>
    <div class="nav-title">איך מגיעים?</div>
    <div class="links" id="matchLinks"></div>
    <button class="btn ghost" id="keepSwiping">להמשיך להחליק</button>
  </div>
</section>
<div class="hearts" id="hearts" aria-hidden="true"></div>

<section class="screen slot" id="slot" hidden>
  <div class="reel-emoji" id="reelEmoji">🎲</div>
  <div class="reel" id="reel">מגריל…</div>
</section>

<div class="drawer" id="drawer" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">המאצ'ים שלי</h2><button class="close" id="closeDrawer">סגירה</button></div>
    <ul id="likesList"></ul>
  </div>
</div>

function getLocation() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error("nogeo"));
    navigator.geolocation.getCurrentPosition(

  });
}

/* ---------- OSM opening_hours (common formats) ---------- */
function osmOpenState(oh, now = new Date()) {
  if (!oh) return null;
  oh = oh.trim();
  if (oh === "24/7") return { open: true, label: "פתוח 24/7" };
  const D = ["Su","Mo","Tu","We","Th","Fr","Sa"];
  const today = now.getDay(), yday = (today + 6) % 7, mins = now.getHours() * 60 + now.getMinutes();
  const dayRe = /^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)+)\s+(.*)$/;
  let parsed = false, todayRanges = null, ydayRanges = null;
  for (const raw of oh.split(";")) {
    const rule = raw.trim(); if (!rule) continue;
    let days = null, time = rule;
    const m = rule.match(dayRe);
    if (m) { days = m[1]; time = m[2].trim(); }
    else if (/^(Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)/.test(rule)) { if (!/^(Mo|Tu|We|Th|Fr|Sa|Su)/.test(rule)) continue; }
    const applies = d => !days || days.split(",").some(seg => {
      const [a, b] = seg.trim().split(/\s*-\s*/); const ia = D.indexOf(a), ib = b ? D.indexOf(b) : ia;
      if (ia < 0 || ib < 0) return false; return ia <= ib ? d >= ia && d <= ib : d >= ia || d <= ib;
    });
    let ranges;
    if (/^(off|closed)$/i.test(time)) ranges = [];
    else {
      ranges = [...time.matchAll(/(\d{1,2}):(\d{2})\s*[-–]\s*(\d{1,2}):(\d{2})/g)].map(g => {
        const s = +g[1]*60 + +g[2]; let e = +g[3]*60 + +g[4]; if (e <= s) e += 1440;
        return { s, e, end: `${g[3].padStart(2,"0")}:${g[4]}`, start: `${g[1].padStart(2,"0")}:${g[2]}` };
      });
      if (!ranges.length) continue;
    }
    parsed = true;
    if (applies(today)) todayRanges = ranges;
    if (applies(yday)) ydayRanges = ranges;
  }
  if (!parsed) return null;
  for (const r of ydayRanges || []) if (r.e > 1440 && mins < r.e - 1440) return { open: true, label: `פתוח עד ${r.end}` };
  for (const r of todayRanges || []) if (mins >= r.s && mins < r.e) return { open: true, label: `פתוח עד ${r.end}` };
  const next = (todayRanges || []).find(r => r.s > mins);
  return { open: false, label: next ? `סגור · נפתח ב-${next.start}` : "סגור עכשיו" };
}

/* ---------- source 0: מאגר ערים משלך (data/*.json, נבנה ע"י scripts/build_city.py) ---------- */
async function loadCityData(pos) {
  let idx;
  try {
    idx = await withTimeout(fetch("data/index.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), 6000);
  } catch { return null; }                                 // אין מאגר — ממשיכים למשיכה חיה
  const m = 0.03;                                          // קצת מרווח מעבר לגבולות העיר
  const inside = c => pos.lat >= c.bbox[0] - m && pos.lat <= c.bbox[2] + m && pos.lon >= c.bbox[1] - m && pos.lon <= c.bbox[3] + m;
  const near = (idx.cities || []).filter(inside)
    .sort((a, b) => km(pos, { lat: a.center[0], lon: a.center[1] }) - km(pos, { lat: b.center[0], lon: b.center[1] }))[0];
  if (!near) return null;
  if (S.cityDoc?.slug === near.slug) return S.cityDoc;
  try {
    S.cityDoc = await withTimeout(fetch(`data/${near.slug}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }), 20000);
    return S.cityDoc;
  } catch (e) { S.errors.push("city data: " + (e.message || e)); return null; }
}
function cityPlaces(doc, pos, radiusKm) {
  return doc.places.map(q => {
    const st = osmOpenState(q.hours);
    return { ...q, source: "city", cuisines: q.cuisines || [], hoursRaw: q.hours || "",
      openNow: st ? st.open : null, openLabel: st ? st.label : "",
      photoCredit: q.photo ? "מאתר המקום" : "", dist: km(pos, q) };
  }).filter(p => p.dist <= radiusKm);
}

async function overpassTry(url, q, signal) {
  const host = hostOf(url);
  const res = await fetch(url, { method:"POST", body:"data=" + encodeURIComponent(q),
    headers:{ "Content-Type":"application/x-www-form-urlencoded" }, signal });
  if (!res.ok) throw new Error(`${host}: HTTP ${res.status}`);
  let j; try { j = JSON.parse(await res.text()); } catch { throw new Error(`${host}: bad response`); }
  if (!Array.isArray(j.elements)) throw new Error(`${host}: no elements`);
  if (!j.elements.length && j.remark) throw new Error(`${host}: ${j.remark.slice(0, 90)}`);
  return j.elements;
}
async function fetchNominatim(pos, radiusKm) {
  // גיבוי: חיפוש של OpenStreetMap עצמו (עד 40 תוצאות לכל סוג)
  const dLat = radiusKm / 111, dLon = radiusKm / (111 * Math.cos(pos.lat * Math.PI / 180));
  const vb = [pos.lon - dLon, pos.lat + dLat, pos.lon + dLon, pos.lat - dLat].map(n => n.toFixed(5)).join(",");
  const out = new Map();
  for (const q of ["restaurant", "cafe", "fast food", "bar"]) {
    try {
      const u = `https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&viewbox=${vb}&bounded=1&limit=40&extratags=1&addressdetails=1&accept-language=he`;
      const j = await withTimeout(fetch(u).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }), 12000);
      for (const x of j) if (x.category === "amenity" && AMENITY[x.type] && x.name) out.set(x.osm_type + x.osm_id, {
        type: x.osm_type, id: x.osm_id, lat: +x.lat, lon: +x.lon,
        tags: { ...(x.extratags || {}), amenity: x.type, name: x.name,
          "addr:street": x.address?.road, "addr:housenumber": x.address?.house_number,
          "addr:city": x.address?.city || x.address?.town || x.address?.village },
      });
    } catch (e) { S.errors.push("nominatim: " + e.message); }
    await new Promise(r => setTimeout(r, 1100));   // מדיניות השימוש: בקשה אחת לשנייה
  }
  return [...out.values()];
}
async function fetchOSM(pos, radiusKm) {
  const q = `[out:json][timeout:25];
    (nwr["amenity"~"^(restaurant|cafe|fast_food|ice_cream|bar|pub|food_court|biergarten)$"]["name"](around:${Math.round(radiusKm*1000)},${pos.lat},${pos.lon}););
    out center tags 400;`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 28000);
  let elements = null;
  try {
    // שולחים לכל השרתים במקביל ולוקחים את הראשון שעונה
    elements = await Promise.any(OVERPASS.map(u => overpassTry(u, q, ctrl.signal)));
  } catch (agg) {
    for (const e of (agg.errors || [agg])) S.errors.push(e.name === "AbortError" ? "overpass: timeout" : String(e.message || e));
  } finally { clearTimeout(timer); ctrl.abort(); }
  if (!elements) {
    loadingState("עוד רגע…", "שרתי המפות עמוסים, מנסה דרך אחרת");
    S.usedFallback = true;
    elements = await fetchNominatim(pos, radiusKm);
    if (!elements.length) throw new Error("osm-empty");
  }
  const places = [];
  for (const el of elements) { try { const p = osmToPlace(el, pos); if (p) places.push(p); } catch (e) { console.warn("skip", el, e); } }
  await addWikidataLogos(places);
  return places;
}
function normUrl(u) { if (!u) return ""; u = u.split(";")[0].trim(); return /^https?:\/\//i.test(u) ? u : "https://" + u; }

  const street = t["addr:street"] ? `${t["addr:street"]} ${t["addr:housenumber"] || ""}`.trim() : "";

const G_BASE = ["id","displayName","location","photos","rating","userRatingCount","priceLevel","websiteURI","nationalPhoneNumber","internationalPhoneNumber","formattedAddress","primaryType","types","editorialSummary","regularOpeningHours","utcOffsetMinutes"];
const G_EXTRA = ["primaryTypeDisplayName","servesVegetarianFood","hasOutdoorSeating","hasTakeout","hasDelivery","isGoodForChildren"];
const G_GROUPS = [

  { types:["restaurant"], rank:"DISTANCE" },
  { types:["fast_food_restaurant","pizza_restaurant","hamburger_restaurant","sandwich_shop","middle_eastern_restaurant"], rank:"POPULARITY" },
  { types:["cafe","coffee_shop","bakery","ice_cream_shop","dessert_shop"], rank:"POPULARITY" },
  { types:["sushi_restaurant","japanese_restaurant","asian_restaurant","italian_restaurant","mexican_restaurant","indian_restaurant","thai_restaurant","chinese_restaurant","ramen_restaurant"], rank:"POPULARITY" },

async function fetchGoogle(pos, radiusKm) {

  let fields = [...G_BASE, ...G_EXTRA];

  try { await run(G_GROUPS[0]); } catch { fields = G_BASE; }
  const results = await Promise.allSettled(G_GROUPS.map(run));

}

/* ---------- deck ---------- */
/* פופולריות: בגוגל לפי דירוג ומספר מדרגים; ב-OpenStreetMap לפי כמה המקום מתועד (אין שם דירוגים) */

    const n = p.ratingCount, bayes = (p.rating * n + 3.9 * 40) / (n + 40);
    return Math.min(1, Math.max(0, (bayes - 3.6) / 1.3)) * .6 + Math.min(1, Math.log10(n + 1) / 3.5) * .4;
  }

  return f.filter(Boolean).length / f.length;
}

/* ---------- swipe ---------- */
function attachDrag(card) {
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false;
  const yes = card.querySelector(".stamp.yes"), no = card.querySelector(".stamp.no");
  card.addEventListener("pointerdown", e => {
    if (e.target.closest("a,button")) return;       // לחיצה על קישור בכרטיס לא מתחילה החלקה
    drag = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => {
    if (!drag) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) > 6 && !card.hasPointerCapture(e.pointerId)) card.setPointerCapture(e.pointerId);
    card.style.transform = `translate(${dx}px, ${dy * .25}px) rotate(${dx / 16}deg)`;
    yes.style.opacity = Math.max(0, Math.min(1, dx / 90));
    no.style.opacity = Math.max(0, Math.min(1, -dx / 90));
  });
  const end = () => {
    if (!drag) return; drag = false;
    card.style.transition = "";
    if (Math.abs(dx) > Math.min(110, window.innerWidth * .25)) fling(dx > 0 ? 1 : -1, dy);
    else { card.style.transform = ""; yes.style.opacity = no.style.opacity = 0; }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}
let busy = false;
function fling(dir, dy = 0) {

  if (!card || !p || busy) return;
  busy = true;
  card.querySelector(dir > 0 ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
  card.style.transition = "transform .38s ease-in";
  card.style.transform = `translate(${dir * window.innerWidth * 1.2}px, ${dy * .25 + 40}px) rotate(${dir * 28}deg)`;
  S.seen.add(p.id);
  setTimeout(() => { S.idx++; busy = false; renderDeck(); if (dir > 0) openMatch(p); }, 300);
}

/* ---------- surprise ---------- */
function surprise() {
  const f = FILTERS.find(x => x.id === S.filter);
  let pool = S.deck.slice(S.idx);
  if (!pool.length) pool = S.all.filter(f.test);
  if (!pool.length) pool = S.all;
  if (!pool.length) return;
  const pick = pool[Math.floor(Math.random() * pool.length)];
  $("slot").hidden = false;
  let n = 0; const total = 16;
  const spin = () => {
    const p = n < total - 1 ? pool[Math.floor(Math.random() * pool.length)] : pick;
    $("reel").textContent = p.name; $("reelEmoji").textContent = look(p).e;
    if (++n < total) setTimeout(spin, 60 + n * n * 1.6);
    else setTimeout(() => {
      $("slot").hidden = true;
      const i = S.deck.indexOf(pick, S.idx);
      if (i >= 0) { S.deck.splice(i, 1); S.seen.add(pick.id); renderDeck(); }
      openMatch(pick, true);
    }, 700);
  };
  spin();
}

$("sortSel").onchange = e => { S.sort = e.target.value; buildDeck(); };
$("likeBtn").onclick = () => fling(1);
$("nopeBtn").onclick = () => fling(-1);
$("surpriseBtn").onclick = surprise;
$("keepSwiping").onclick = () => { $("match").hidden = true; };
$("likesBtn").onclick = () => {
  $("likesList").innerHTML = S.likes.length ? S.likes.map(p => { const L = look(p); return `
    <li>${logoHTML(p, L)}<span class="t"><b>${esc(p.name)}</b><small>${esc(L.he)}${p.address ? " · " + esc(p.address) : ""}</small></span>
      <a href="https://waze.com/ul?ll=${p.lat},${p.lon}&navigate=yes" target="_blank" rel="noopener">סע</a></li>`; }).join("")
    : `<li style="border:0;justify-content:center;color:var(--muted)">עוד אין מאצ'ים. תחליקי ימינה על משהו טעים.</li>`;
  $("drawer").hidden = false;
};
$("closeDrawer").onclick = () => $("drawer").hidden = true;
$("drawer").onclick = e => { if (e.target.id === "drawer") $("drawer").hidden = true; };
document.addEventListener("keydown", e => {
  if (!$("app").hidden && $("match").hidden && $("drawer").hidden) {
    if (e.key === "ArrowRight") fling(1);
    if (e.key === "ArrowLeft") fling(-1);
  }
  if (e.key === "Escape") { $("match").hidden = true; $("drawer").hidden = true; }
});

function show(id) { ["welcome","loading","app"].forEach(x => $(x).hidden = x !== id); }
function loadingState(title, sub, isError) {
  show("loading"); $("loadingText").textContent = title; $("loadingSub").textContent = sub; $("retryBtn").hidden = !isError;
  $("errDetail").hidden = !isError || !S.errors.length;
  $("errDetail").textContent = [...new Set(S.errors)].slice(-6).join(" | ");
}
async function load(keepPos) {
  try {
    if (!keepPos || !S.pos) { loadingState("מאתר איפה את…", "אם הטלפון שואל, צריך לאשר גישה למיקום"); S.pos = await getLocation(); }
    loadingState("מחפש מקומות סביבך…", `ברדיוס ${S.radius} ק״מ`);
    S.all = []; S.errors = []; S.usedFallback = false; S.sourceLabel = "";
    const doc = await loadCityData(S.pos);
    if (doc) {
      S.all = cityPlaces(doc, S.pos, S.radius); S.source = "city"; S.sourceLabel = `מאגר ${doc.city}`;
      addWikidataLogos(S.all.filter(p => !p.logo)).then(() => renderDeck()).catch(() => {});
    }
    if (!S.all.length && CONFIG.googleApiKey) {
      try { S.all = await fetchGoogle(S.pos, S.radius); S.source = "google"; S.sourceLabel = "Google"; }
      catch (e) { S.errors.push("google: " + (e.message || e)); console.warn("Google Places failed, falling back to OSM", e); }
    }
    if (!S.all.length) { S.all = await fetchOSM(S.pos, S.radius); S.source = "osm"; S.sourceLabel = S.usedFallback ? "OSM גיבוי" : "OSM חי"; }
    if (!S.all.length && S.radius < 10) { S.radius = RADII.find(r => r > S.radius); return load(true); }
    if (S.filter !== "all" && !S.all.some(FILTERS.find(f => f.id === S.filter).test)) S.filter = "all";
    renderChips(); show("app"); buildDeck();
  } catch (e) {
    if (e && e.code === 1) loadingState("צריך אישור מיקום", "בלי מיקום אי אפשר למצוא מקומות קרובים. אפשר לאשר בהגדרות הדפדפן לאתר הזה ולנסות שוב.", true);
    else if (e && (e.code === 2 || e.code === 3)) loadingState("לא הצלחתי לאתר מיקום", "כדאי לוודא שה-GPS דלוק ולנסות שוב.", true);
    else {
      if (e && e.message && e.message !== "osm-empty") S.errors.push(String(e.message));
      loadingState("לא הצלחתי לטעון מקומות", location.protocol === "file:"
        ? "נראה שהקובץ נפתח ישירות מהמחשב. כדאי לפתוח אותו מכתובת אינטרנט (למשל GitHub Pages) ולנסות שוב."
        : "שרתי המפות לא ענו. אפשר לנסות שוב בעוד רגע. אם זה חוזר, שלח לי את השורה הקטנה שלמטה.", true);
    }
  }
}

$("welcomeTitle").textContent = `היי ${CONFIG.herName}`;
$("dedication").textContent = CONFIG.dedication;
$("fromLine").textContent = CONFIG.from;
$("likesCount").textContent = S.likes.length;
$("startBtn").onclick = () => load(false);
$("retryBtn").onclick = () => load(!!S.pos);
</script>
</body>
</html>
