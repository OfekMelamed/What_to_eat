name: בניית מאגר מסעדות

on:
  # הרצה ידנית: Actions → "בניית מאגר מסעדות" → Run workflow → שם עיר
  workflow_dispatch:
    inputs:
      city:
        description: "שם עיר (למשל: תל אביב, Haifa, Rome). ריק = לרענן את כל הערים"
        required: false
      radius_km:
        description: "לא חובה: רדיוס בק״מ סביב מרכז העיר במקום גבולות העיר"
        required: false
  # ריענון אוטומטי פעם בחודש (1 לחודש, 06:00 שעון ישראל)
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Build
        env:
          CITY: ${{ inputs.city }}
          RADIUS: ${{ inputs.radius_km }}
        run: |
          if [ -n "$CITY" ]; then
            python scripts/build_city.py "$CITY" --add-to-list ${RADIUS:+--radius-km "$RADIUS"}
          else
            python scripts/build_city.py --all
          fi

      - name: Commit data
        env:
          CITY: ${{ inputs.city }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data cities.txt
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: ${CITY:-monthly refresh}"
          git pull --rebase
          git push
